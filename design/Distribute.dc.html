<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Cairo, "Segoe UI", system-ui, sans-serif; direction: rtl; }
    a { color: #b45309; } a:hover { color: #8a3f08; }
    .num { font-variant-numeric: tabular-nums; }
    .btn { display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 14px;
           font-size:13px;font-weight:700;border:1px solid transparent;cursor:pointer;min-height:40px; }
    .lbl { font-size:11.5px;font-weight:800;color:#9c7a63;letter-spacing:.03em;margin-bottom:7px;display:block; }
  </style>
</helmet>

<div style="background:rgba(54,32,20,.45);padding:30px;display:flex;align-items:flex-start;justify-content:center;">
  <div style="width:740px;background:#fff;border-radius:16px;box-shadow:0 26px 60px rgba(54,32,20,.28);overflow:hidden;">

    <div style="padding:16px 22px;border-bottom:1px solid rgba(111,70,40,.14);display:flex;align-items:center;justify-content:space-between;">
      <h6 style="margin:0;font-size:16px;font-weight:800;color:#362014;">تفريق الكتاب 2433</h6>
      <span style="font-size:12px;color:#9c7a63;font-weight:700;">الهامشُ يسبق الرقم — فالقصاصةُ من مسحة التسجيل</span>
    </div>

    <div style="padding:20px 22px;display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:22px;">

      <!-- يمين: الهامش -->
      <div>
        <span class="lbl">هامشُ المدير — قُصَّ من الصفحة 1</span>
        <div style="border:2px solid #d87b44;border-radius:12px;overflow:hidden;background:#fdfaf5;position:relative;">
          <div style="height:150px;background:repeating-linear-gradient(178deg,#fdfaf5 0 15px,#f3ece2 15px 16px);"></div>
          <div style="position:absolute;inset:26px 22px auto 22px;height:74px;border:2px dashed #b45309;
                      border-radius:8px;background:rgba(249,168,38,.12);"></div>
          <div style="position:absolute;left:10px;bottom:10px;background:#362014;color:#fff;border-radius:7px;
                      padding:3px 9px;font-size:11px;font-weight:700;">اسحب لتحديد الهامش</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:9px;align-items:center;">
          <span style="font-size:12px;color:#6f4631;font-weight:700;">الصفحة</span>
          <select style="font-family:Cairo,sans-serif;font-size:12px;font-weight:700;padding:6px 10px;
                         border:1px solid rgba(111,70,40,.24);border-radius:9px;">
            <option>1 — البروفايل</option><option>2</option><option>3</option>
          </select>
          <span style="font-size:11.5px;color:#9c7a63;font-weight:600;">99% على البروفايل</span>
        </div>

        <span class="lbl" style="margin-top:16px;">نصُّ الهامش — عند الحاجة إليه فقط</span>
        <textarea style="width:100%;box-sizing:border-box;height:76px;font-family:Cairo,sans-serif;font-size:13px;
                         line-height:1.8;padding:11px 13px;border:1px solid rgba(111,70,40,.24);
                         border-radius:11px;resize:none;color:#4a2f1e;background:#fffdfa;">يُحال إلى شعبة متابعة تنفيذ الموازنة للإجراء اللازم، ويُجاب خلال أسبوع.</textarea>
      </div>

      <!-- يسار: الأهداف -->
      <div>
        <span class="lbl">إلى</span>
        <div style="display:flex;flex-direction:column;gap:9px;">
          <sc-for list="{{targets}}" as="t" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;
                        border:1px solid {{t.border}};background:{{t.bg}};">
              <span style="width:9px;height:9px;border-radius:50%;background:{{t.dot}};"></span>
              <div style="flex-grow:1;">
                <div style="font-size:13.5px;font-weight:700;color:#362014;">{{t.name}}</div>
                <div style="font-size:11.5px;color:#9c7a63;font-weight:600;">{{t.kind}}</div>
              </div>
              <div style="display:flex;gap:5px;">
                <span style="border-radius:8px;padding:4px 10px;font-size:11px;font-weight:800;
                             background:{{t.aBg}};color:{{t.aFg}};">للتنفيذ</span>
                <span style="border-radius:8px;padding:4px 10px;font-size:11px;font-weight:800;
                             background:{{t.iBg}};color:{{t.iFg}};">للعلم</span>
              </div>
            </div>
          </sc-for>
        </div>

        <button class="btn" style="margin-top:10px;background:#fff;color:#b45309;
                border-color:rgba(180,83,9,.35);width:100%;justify-content:center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          إضافة وحدة أو قسم — أو عنقود
        </button>

        <div style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;
                    background:#fdf6ec;border-radius:11px;padding:11px 13px;">
          <div>
            <div style="font-size:13px;font-weight:800;color:#362014;">مهلةُ الإجابة</div>
            <div style="font-size:11.5px;color:#6f4631;font-weight:600;">تُطارَد صفوفُ «للتنفيذ» وحدها</div>
          </div>
          <input value="2026/08/31" class="num" style="width:118px;font-family:Cairo,sans-serif;font-size:13px;
                 font-weight:700;padding:8px 10px;border:1px solid rgba(111,70,40,.24);border-radius:9px;text-align:center;" />
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 22px;
                border-top:1px solid rgba(111,70,40,.14);background:#fffdfa;">
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#4a2f1e;font-weight:700;cursor:pointer;">
        <input type="checkbox" checked style="width:16px;height:16px;accent-color:#b45309;" />
        اطبع كشفَ تسليمٍ للتوقيع
      </label>
      <div style="display:flex;gap:8px;">
        <button class="btn" style="background:#fff;color:#6f4631;border-color:rgba(111,70,40,.24);">إلغاء</button>
        <button class="btn" style="background:linear-gradient(180deg,#b45309,#8a3f08);color:#fff;">تفريق وتسجيل</button>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const on  = { aBg: 'rgba(217,119,6,.2)',  aFg: '#b45309', iBg: '#f2ece4', iFg: '#9c7a63' };
    const off = { aBg: '#f2ece4', aFg: '#9c7a63', iBg: 'rgba(37,99,235,.14)', iFg: '#1e40af' };
    return {
      targets: [
        { name: 'شعبة متابعة تنفيذ الموازنة', kind: 'وحدةٌ في قسمنا', dot: '#d87b44',
          bg: '#fffaf3', border: '#d87b44', ...on },
        { name: 'وحدة التقارير', kind: 'وحدةٌ في قسمنا', dot: '#2563eb',
          bg: '#fff', border: 'rgba(111,70,40,.16)', ...off },
        { name: 'القسم القانوني — ش3', kind: 'قسمٌ آخر في الشركة', dot: '#7c3aed',
          bg: '#fff', border: 'rgba(111,70,40,.16)', ...on },
      ],
    };
  }
}
</script>
</body>
</html>
