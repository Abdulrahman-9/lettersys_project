{% comment %}
أزرارُ دورة الحياة — تُدرَج في ترويسة اللوحة وفي حالتها المنكمشة معاً، فيبقى
موضعُها واحداً مهما كان للكتاب تاريخٌ أو لم يكن.
{% endcomment %}
<div class="btn-group btn-group-sm" role="group" aria-label="إجراءات دورة الحياة">
  <button type="button" class="btn btn-outline-primary"
          data-bs-toggle="modal" data-bs-target="#distributeModal">
    <i class="bi bi-arrow-left-right me-1"></i>تفريق
  </button>
  <button type="button" class="btn btn-outline-primary"
          data-bs-toggle="modal" data-bs-target="#custodyModal">
    <i class="bi bi-person-badge me-1"></i>عهدة
  </button>
  <button type="button" class="btn btn-outline-secondary" id="registerHereBtn"
          title="امنحه رقمَ واردٍ من عدّاد قسمي">
    <i class="bi bi-journal-plus me-1"></i>قيّده عندنا
  </button>
  {% if can_archive_book %}
    {% if book_is_archived %}
      <button type="button" class="btn btn-outline-secondary" id="reopenArchiveBtn"
              title="أخرِجه من الأرشيف بسببٍ مسجَّل">
        <i class="bi bi-box-arrow-up me-1"></i>فتحُ المؤرشَف
      </button>
    {% else %}
      <button type="button" class="btn btn-outline-primary"
              data-bs-toggle="modal" data-bs-target="#archiveModal"
              title="قيّد تمامَ الأرشفة والحفظ">
        <i class="bi bi-archive me-1"></i>تمامُ أرشفة
      </button>
    {% endif %}
  {% endif %}
</div>
