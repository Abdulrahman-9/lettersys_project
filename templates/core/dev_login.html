{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2>صفحة تسجيل دخول تجريبية</h2>
  <p>هذه صفحة تطوير محلية — ستسجل الدخول كمستخدم <strong>dev_demo</strong>.</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">تسجيل دخول سريع (dev_demo)</button>
  </form>
  <p class="mt-3"><small>تعمل هذه الصفحة فقط عندما يكون DEBUG=True.</small></p>
</div>
{% endblock %}
