{% load static %}
{% comment %}
============================================
التبويبان الرئيسيان: وارد (أزرق ملكي) / صادر (أصفر ملكي)
عرض كامل للصفحة، 50/50
============================================
{% endcomment %}

<div class="tabs-split" role="tablist">

  <button class="tab-main tab-incoming {% if current_tab|slice:':8' == 'incoming' %}active{% endif %}"
          role="tab"
          data-tab="incoming"
          aria-selected="{% if current_tab|slice:':8' == 'incoming' %}true{% else %}false{% endif %}">
    <i class="bi bi-box-arrow-in-down tab-icon"></i>
    <div class="tab-text">
      <span class="tab-label">وارد</span>
      <span class="tab-count" id="badge-incoming">{{ incoming_count|default:0 }}</span>
    </div>
  </button>

  <button class="tab-main tab-outgoing {% if current_tab|slice:':8' == 'outgoing' %}active{% endif %}"
          role="tab"
          data-tab="outgoing"
          aria-selected="{% if current_tab|slice:':8' == 'outgoing' %}true{% else %}false{% endif %}">
    <i class="bi bi-box-arrow-up tab-icon"></i>
    <div class="tab-text">
      <span class="tab-label">صادر</span>
      <span class="tab-count" id="badge-outgoing">{{ outgoing_count|default:0 }}</span>
    </div>
  </button>

</div>
