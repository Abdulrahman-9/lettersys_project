{# مودال معاينة المستند المنبثق الأنيق — يُضمَّن في base.html ويعمل من أي صفحة عبر data-doc-preview #}
<div class="modal fade" id="docPreviewModal" tabindex="-1" aria-labelledby="docPreviewName" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-fullscreen-lg-down">
    <div class="modal-content border-0 shadow-lg" style="border-radius:16px; overflow:hidden;">
      <div class="modal-header py-2 px-3" style="background:linear-gradient(135deg,#ff9233,#ff7b18);color:#fff;">
        <h6 class="modal-title mb-0 d-flex align-items-center gap-2">
          <i class="bi bi-file-earmark-text"></i><span id="docPreviewName">معاينة المستند</span>
        </h6>
        <div class="ms-auto d-flex align-items-center gap-2">
          <a href="#" id="docPreviewOpen" target="_blank" rel="noopener" class="btn btn-sm btn-light py-0 px-2" title="فتح في تبويب جديد"><i class="bi bi-box-arrow-up-right"></i></a>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
        </div>
      </div>
      <div class="modal-body p-0" id="docPreviewBody"></div>
    </div>
  </div>
</div>
{# السلوك في static/js/doc_view.js (DocView.open + معالج data-doc-preview) #}
